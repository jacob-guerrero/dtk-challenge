name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fleetpulse
          POSTGRES_USER: fleetpulse
          POSTGRES_PASSWORD: fleetpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetpulse -d fleetpulse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fleetpulse:fleetpulse@localhost:5432/fleetpulse
      INGEST_API_KEY: ci-ingest-key
      LLM_PROVIDER: extractive
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:integration
      - run: pnpm --filter @fleetpulse/frontend build
