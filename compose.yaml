services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleetpulse -d fleetpulse']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
